<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stakeholder Question Maps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: tab strip, one horizontal mind map (centre at right, RTL), detail panel beneath */
:root{--bg:#f6f7f9;--surface:#fff;--fg:#1d2433;--muted:#5d6678;--line:#b9c0cd;--ctr:#1d2a4a;--ctrfg:#fff;
--g:#44506a;--M1:#3355c4;--M2:#1f7a52;--M3:#b36b00;--M4:#a8325e;
--M1bg:#e5ebfb;--M2bg:#dff1e8;--M3bg:#fbeed6;--M4bg:#f7e1ea;--sel:#fff6c7;
--ff:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--surface:#1a2030;--fg:#e6eaf3;--muted:#98a2b8;--line:#3a4358;--ctr:#2c3d6b;--ctrfg:#fff;
--g:#8d99b5;--M1:#8ba2ff;--M2:#5fd0a0;--M3:#f0b45a;--M4:#f08bb0;--M1bg:#222c52;--M2bg:#173a2c;--M3bg:#43331a;--M4bg:#47202f;--sel:#4a4320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10141d;--surface:#1a2030;--fg:#e6eaf3;--muted:#98a2b8;--line:#3a4358;--ctr:#2c3d6b;--ctrfg:#fff;
--g:#8d99b5;--M1:#8ba2ff;--M2:#5fd0a0;--M3:#f0b45a;--M4:#f08bb0;--M1bg:#222c52;--M2bg:#173a2c;--M3bg:#43331a;--M4bg:#47202f;--sel:#4a4320;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sep{width:1px;background:var(--line);margin:4px 6px}
.tab{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tab[aria-selected=true]{background:var(--ctr);color:var(--ctrfg);border-color:var(--ctr)}
.tab:focus-visible,.leaf:focus-visible{outline:2px solid var(--M1);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.mapbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
svg{display:block;min-width:900px;width:100%;height:auto;font-family:var(--ff)}
svg{direction:ltr}svg text{unicode-bidi:plaintext}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.ctr rect{fill:var(--ctr)} .ctr text{fill:var(--ctrfg);font-weight:700;font-size:16px}
.br rect{fill:var(--surface);stroke:var(--g);stroke-width:1.6} .br text{fill:var(--fg);font-weight:600;font-size:14px}
.leaf{cursor:pointer} .leaf rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.leaf:hover rect.box,.leaf.on rect.box{stroke:var(--fg)} .leaf.on rect.box{fill:var(--sel)}
.leaf text.t{fill:var(--fg);font-size:13px} .chip text{font-size:10.5px;font-weight:700;fill:#fff}
.chip.M1 rect{fill:var(--M1)}.chip.M2 rect{fill:var(--M2)}.chip.M3 rect{fill:var(--M3)}.chip.M4 rect{fill:var(--M4)}
:root:not([data-theme]) .chip text{fill:#fff}
@media (prefers-color-scheme:dark){.chip text{fill:#10141d}}
:root[data-theme="dark"] .chip text{fill:#10141d}
:root[data-theme="light"] .chip text{fill:#fff}

.detail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.detail h2{font-size:1rem;margin:0 0 8px}
.q{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px}
.q:first-of-type{border-top:0}.detail{max-height:60vh;overflow:auto}
.qid{font-weight:700;font-size:.82rem;padding:2px 8px;border-radius:6px;height:fit-content}
.qid.M1{background:var(--M1bg);color:var(--M1)}.qid.M2{background:var(--M2bg);color:var(--M2)}.qid.M3{background:var(--M3bg);color:var(--M3)}.qid.M4{background:var(--M4bg);color:var(--M4)}
.ctr text.cnt{font-weight:500;font-size:13px}
.hint{color:var(--muted)}
.cm{grid-column:1/-1;margin-top:6px}
.cm-list{display:grid;gap:6px;margin-bottom:6px}
.cmt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.9rem}
.cmt .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:.78rem;margin-bottom:2px}
.tb{font-weight:700;padding:1px 8px;border-radius:6px;font-size:.76rem;color:var(--fg);background:var(--line)}
.tb.t1{background:var(--M1bg);color:var(--M1)}.tb.t2{background:var(--M2bg);color:var(--M2)}.tb.t3{background:var(--M3bg);color:var(--M3)}.tb.t4{background:var(--M4bg);color:var(--M4)}
.cmt .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.lnk{font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.addbtn{font:inherit;font-size:.82rem;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.form{display:none;gap:8px;margin-top:6px}.form.open{display:grid}
.form select,.form textarea{font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;box-sizing:border-box}
.form textarea{min-height:64px;resize:vertical}
.form .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.send{font:inherit;padding:6px 16px;border-radius:8px;border:0;background:var(--ctr);color:var(--ctrfg);cursor:pointer}
.err{color:var(--M4);font-size:.82rem}
.note{color:var(--muted);font-size:.85rem;margin:8px 0}
#allcm{display:none}#allcm.on{display:block}
.filter{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.filter select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.qref{font-weight:700;font-size:.82rem}
</style>
<style>:root{color-scheme:light dark}body{margin:0}</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
<h1>خرائط الأسئلة حسب الموديول وصاحب المصلحة</h1>
<p class="sub">كل موديول منفصل، ثم الأسئلة مجمعة عند كل صاحب مصلحة عبر الفرق الأربعة. اضغط على أي عقدة لعرض أسئلتها كاملة.</p>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="legend" id="legend"></div>
<div class="mapbox"><svg id="svg" role="img" aria-label="خريطة ذهنية"></svg></div>
<div class="detail" id="allcm"></div>
<div class="detail" id="detail"><p class="hint">اضغط على عقدة في الخريطة لعرض أسئلتها.</p></div>
</div>
<script>
const D={"maps": {"m1": {"c": "Team 1 — القبول وإدارة الطلبة\n27 سؤالًا", "b": [{"t": "المتقدمون للالتحاق", "l": [{"t": "ما أكثر الصعوبات التي تواجهك عند التقديم للالتحاق ببرنامج أكاديمي من خلال منصة إلكترونية؟", "m": 1, "qs": [{"i": "T1-1", "t": "ما أكثر الصعوبات التي تواجهك عند التقديم للالتحاق ببرنامج أكاديمي من خلال منصة إلكترونية؟"}]}, {"t": "ما العوامل أو الخصائص التي من شأنها أن تجعل تجربة التقديم الإلكتروني أسهل وأكثر سهولة بالنسبة لك؟", "m": 1, "qs": [{"i": "T1-2", "t": "ما العوامل أو الخصائص التي من شأنها أن تجعل تجربة التقديم الإلكتروني أسهل وأكثر سهولة بالنسبة لك؟"}]}, {"t": "هل واجهت أي مشكلات أثناء رفع المستندات المطلوبة، مثل بيان الدرجات أو شهادة التخرج؟ إذا كانت الإجابة نعم، فما طبيعة هذه المشكلات؟", "m": 1, "qs": [{"i": "T1-3", "t": "هل واجهت أي مشكلات أثناء رفع المستندات المطلوبة، مثل بيان الدرجات أو شهادة التخرج؟ إذا كانت الإجابة نعم، فما طبيعة هذه المشكلات؟"}]}, {"t": "إذا اكتشف موظف القبول أن أحد المستندات التي قمت برفعها غير واضح أو غير مكتمل أو غير صحيح، فما الطريقة التي تفضل أن يتم من خلالها إخطارك وإتاحة تعديل هذا المستند تحديدًا دون الحاجة إلى إعادة رفع جميع المستندات؟", "m": 1, "qs": [{"i": "T1-4", "t": "إذا اكتشف موظف القبول أن أحد المستندات التي قمت برفعها غير واضح أو غير مكتمل أو غير صحيح، فما الطريقة التي تفضل أن يتم من خلالها إخطارك وإتاحة تعديل هذا المستند تحديدًا دون الحاجة إلى إعادة رفع جميع المستندات؟"}]}, {"t": "كيف تفضل متابعة حالة طلب الالتحاق الخاص بك؟", "m": 1, "qs": [{"i": "T1-5", "t": "كيف تفضل متابعة حالة طلب الالتحاق الخاص بك؟"}]}, {"t": "ما قنوات التواصل التي تفضل استقبال الإشعارات والتحديثات المتعلقة بطلب الالتحاق من خلالها؟", "m": 1, "qs": [{"i": "T1-6", "t": "ما قنوات التواصل التي تفضل استقبال الإشعارات والتحديثات المتعلقة بطلب الالتحاق من خلالها؟"}]}, {"t": "بعد قبولك وتسجيلك كطالب، كيف تفضل الوصول إلى المعلومات الأكاديمية المتعلقة بالدراسة، مثل جداول المحاضرات، ومواعيدها، والقاعات الدراسية، والإعلانات الأكاديمية؟", "m": 1, "qs": [{"i": "T1-7", "t": "بعد قبولك وتسجيلك كطالب، كيف تفضل الوصول إلى المعلومات الأكاديمية ا function tok(){let t=ls.get('ctok');if(!t){t=[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('');ls.set('ctok',t)}return t}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const sh=()=>({apikey:SUPA.key,Authorization:'Bearer '+SUPA.key,'Content-Type':'application/json'});
async function supaLoad(){
  const r=await fetch(SUPA.url+'/rest/v1/question_comments?select=id,qid,team,author,body,created_at&order=created_at.asc&limit=1000',{headers:sh()});
  if(!r.ok)throw new Error('load');const rows=await r.json();
  CM=rows.map(x=>({id:x.id,qid:x.qid,team:x.team,text:x.body,author:x.author||'',ts:Date.parse(x.created_at),mine:MINE.includes(String(x.id))}));
  document.querySelectorAll('.cm').forEach(b=>fillList(b,b.dataset.q));renderAll();
}
async function supaAdd(qid,team,text,author){
  const r=await fetch(SUPA.url+'/rest/v1/question_comments',{method:'POST',headers:Object.assign({Prefer:'return=representation'},sh()),body:JSON.stringify({qid,team,body:text,author:author||null,owner_hash:await sha(tok())})});
  if(!r.ok)throw new Error('add');const row=(await r.json())[0];if(row){MINE.push(String(row.id));ls.set('mine',JSON.stringify(MINE))}
  await supaLoad();
}
async function supaDel(id){
  const r=await fetch(SUPA.url+'/rest/v1/rpc/delete_own_comment',{method:'POST',headers:sh(),body:JSON.stringify({p_id:id,p_token:tok()})});
  if(!r.ok)throw new Error('del');await supaLoad();
}
async function supaInit(){CMON=true;addCommentsTab();try{await supaLoad()}catch(e){}setInterval(()=>{if(!document.hidden)supaLoad().catch(()=>{})},20000)}
async function initComments(){
  try{
    if(SUPA){await supaInit();return}
    if(!window.claude||!window.claude.use)return;
    DB=await window.claude.use('db');USERC=await window.claude.use('user');
    if(!DB){return}
    CMON=true;
    try{ME=await USERC.id()}catch(e){}
    const tm=setTimeout(()=>{},10000);
    DB.collection('comments').orderBy('ts','asc').limit(1000).onSnapshot(async snap=>{
      clearTimeout(tm);
      CM=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      try{const ids=[...new Set(CM.map(c=>c.uid).filter(Boolean))];if(ids.length&&USERC.profiles){const ps=await USERC.profiles(ids);ids.forEach(i=>NAMES[i]=(ps[i]&&ps[i].name)||'')}}catch(e){}
      document.querySelectorAll('.cm').forEach(b=>fillList(b,b.dataset.q));renderAll();
    },()=>{});
    const hint=det.querySelector('.hint');
    addCommentsTab();
  }catch(e){DB=null}
}
function addCommentsTab(){
  const b=document.createElement('button');b.className='tab';b.textContent='تعليقات الفرق';b.setAttribute('role','tab');b.setAttribute('aria-selected','false');
  b.onclick=()=>{tb.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));
    document.querySelector('.mapbox').style.display='none';det.style.display='none';document.getElementById('allcm').classList.add('on');renderAll()};
  const s=document.createElement('span');s.className='sep';tb.appendChild(s);tb.appendChild(b);
}
const lg=document.getElementById('legend');
[1,2,3,4].forEach(m=>{const s=document.createElement('span');s.innerHTML=`<i style="background:var(--M${m})"></i>`;s.append(D.team[m]+': '+D.mod[m]);lg.appendChild(s)});
const tb=document.getElementById('tabs');
D.tabs.forEach(([k,t,kind],i)=>{if(i>0&&kind!==D.tabs[i-1][2]&&kind!=='g'){const s=document.createElement('span');s.className='sep';tb.appendChild(s)}
  const b=document.createElement('button');b.className='tab';b.textContent=t;b.setAttribute('role','tab');b.setAttribute('aria-selected',i===0);
  b.onclick=()=>{tb.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===b));document.querySelector('.mapbox').style.display='';det.style.display='';document.getElementById('allcm').classList.remove('on');render(k);det.innerHTML=HINT};tb.appendChild(b)});
render('ov');
initComments();
</script>

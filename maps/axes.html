body{background:var(--bg);color:var(--fg);font-family:var(--ff);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:15px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.sep{width:1px;background:var(--line);margin:4px 6px}
.tab{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tab[aria-selected=true]{background:var(--ctr);color:var(--ctrfg);border-color:var(--ctr)}
.tab:focus-visible,.leaf:focus-visible{outline:2px solid var(--D);outline-offset:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.mapbox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
svg{display:block;min-width:900px;width:100%;height:auto;font-family:var(--ff)}
svg{direction:ltr}svg text{unicode-bidi:plaintext}
.edge{fill:none;stroke:var(--line);stroke-width:1.6}
.ctr rect{fill:var(--ctr)} .ctr text{fill:var(--ctrfg);font-weight:700;font-size:16px}
.br rect{fill:var(--surface);stroke:var(--g);stroke-width:1.6} .br text{fill:var(--fg);font-weight:600;font-size:14px}
.leaf{cursor:pointer} .leaf rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.leaf:hover rect.box,.leaf.on rect.box{stroke:var(--fg)} .leaf.on rect.box{fill:var(--sel)}
.leaf text.t{fill:var(--fg);font-size:13px} .chip text{font-size:11px;font-weight:700;fill:#fff}
.chip.D rect{fill:var(--D)}.chip.E rect{fill:var(--E)}.chip.F rect{fill:var(--F)}.chip.I rect{fill:var(--I)}
:root:not([data-theme]) .chip text{fill:#fff}
@media (prefers-color-scheme:dark){.chip text{fill:#10141d}}
:root[data-theme="dark"] .chip text{fill:#10141d}
:root[data-theme="light"] .chip text{fill:#fff}
.star{fill:var(--F);font-size:13px}
.detail{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.detail h2{font-size:1rem;margin:0 0 8px}
.q{padding:8px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px}
.q:first-of-type{border-top:0}
.qid{font-weight:700;font-size:.82rem;padding:2px 8px;border-radius:6px;height:fit-content}
.qid.D{background:var(--Dbg);color:var(--D)}.qid.E{background:var(--Ebg);color:var(--E)}.qid.F{background:var(--Fbg);color:var(--F)}.qid.I{background:var(--Ibg);color:var(--I)}
.q .en{color:var(--muted);font-size:.86rem;direction:ltr;text-align:left}
.hint{color:var(--muted)}
</style>
<style>:root{color-scheme:light dark}body{margin:0}</style>
</head>

const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg'),det=document.getElementById('detail');
const CW=200,BW=210,LW=520,LH=48,GAP=8,GG=18,PAD=16;
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function wrap(s,n){const w=s.split(' '),L=[];let c='';for(const x of w){if((c+' '+x).trim().length>n&&c){L.push(c);c=x}else c=(c+' '+x).trim()}if(c)L.push(c);return L.slice(0,2)}
function curve(x1,y1,x2,y2,p){const m=(x1+x2)/2;el('path',{class:'edge',d:`M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}`},p)}
function render(key){
  const M=D.maps[key];svg.innerHTML='';
  const W=PAD*2+CW+BW+LW+120, xC=W-PAD-CW, xB=xC-60-BW, xL=PAD;
  let y=PAD;const groups=[];
  M.b.forEach(b=>{const y0=y;const ls=b.l.map(l=>{const o={l,y};y+=LH+GAP;return o});y-=GAP;groups.push({b,ls,y0,y1:y});y+=GG});
  const H=y-GG+PAD;svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const cy=H/2, g=el('g',{},svg);

  groups.forEach(G=>{
    const by=(G.y0+G.y1)/2;
    curve(xC,cy,xB+BW,by,g);

  });
  groups.forEach(G=>{
    const by=(G.y0+G.y1)/2,b=el('g',{class:'br'},svg);

    el('text',{x:xB+BW/2,y:by+5,'text-anchor':'middle'},b).textContent=G.b.t;
    G.ls.forEach(o=>{
      const ids=o.l.ids,r=ids[0][0];
      const lf=el('g',{class:'leaf',tabindex:0,role:'button'},svg);
      el('rect',{class:'box',x:xL,y:o.y,width:LW,height:LH,rx:8},lf);
      let label=o.l.t, star='';
      if(!label&&ids.length===1){label=D.Q[ids[0]].ar; if(D.Q[ids[0]].s==='★')star='★'}
      const lines=wrap(label,58);
      lines.forEach((t,i)=>{const yy=o.y+(lines.length===1?LH/2+5:19+i*17);
        const tx=el('text',{class:'t',x:xL+LW-12-(star?16:0),y:yy,'text-anchor':'end'},lf);tx.textContent=t});
      if(star)el('text',{class:'star',x:xL+LW-12,y:o.y+LH/2+5,'text-anchor':'end'},lf).textContent='★';
      ids.slice(0,4).forEach((id,i)=>{const c=el('g',{class:'chip '+id[0]},lf);
        el('rect',{x:xL+10+i*40,y:o.y+LH/2-10,width:36,height:20,rx:5},c);
        el('text',{x:xL+28+i*40,y:o.y+LH/2+4,'text-anchor':'middle'},c).textContent=id});
      const open=()=>{svg.querySelectorAll('.leaf.on').forEach(n=>n.classList.remove('on'));lf.classList.add('on');show(ids,G.b.t,label)};
      lf.addEventListener('click',open);lf.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    });
  });
  el('rect',{x:xC,y:cy-34,width:CW,height:68,rx:14},ctr);
  const cl=wrap(M.c,22);cl.forEach((t,i)=>el('text',{x:xC+CW/2,y:cy+5+(i-(cl.length-1)/2)*20,'text-anchor':'middle'},ctr).textContent=t);
}
function show(ids,branch,label){
  det.innerHTML='';const h=document.createElement('h2');h.textContent=branch+(label&&ids.length>1?' — '+label:'');det.appendChild(h);
  ids.forEach(id=>{const q=D.Q[id],d=document.createElement('div');d.className='q';

}
const tb=document.getElementById('tabs');
